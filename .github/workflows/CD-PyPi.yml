---
name: CD-PyPi
description: "Continuous Deployment workflow for PyPi publishing."
run-name: Build and publish ${{ github.ref_name }} by @${{ github.actor }}

on:
  release:
    types:
      - published

permissions: {}

env:
  # Define Python versions at the top level -- Expected format: X.Y (e.g., 3.14)
  PYTHON_DEFAULT: "${{ vars.PYTHON_DEFAULT || '3.14' }}"
  # Filter pattern for what will be accepted as build artifacts (keep this as narrow as practical)
  BUILD_MATCH_PATTERN: ${{ vars.BUILD_MATCH_PATTERN || 'dist/pip_licenses-*.tar.{bz2,gz} dist/pip_licenses-*-py3-*.whl' }}

jobs:
  pypi-build:
    name: upload release to PyPI
    if: ${{ github.event_name == 'release' && (github.repository == 'raimon49/pip-licenses') && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    # Specifying a GitHub environment is optional, but strongly encouraged
    # environment: pypi
    permissions:
      # IMPORTANT: this permission is mandatory for Build Attestation
      attestations: write
      # IMPORTANT: this permission is NOT needed befor Trusted Publishing
      id-token: none
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    env:
      LANG: "en_US.UTF-8"
    outputs:
      build_status: ${{ steps.build.outcome }}
      build-files: ${{ steps.buildfiles.outputs.files }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-attest-id: ${{ steps.piplicenses-build-chksum-attest.outputs.attestation-id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: build-python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "${{ env.PYTHON_DEFAULT || 3.14 }}"
      - id: output_python
        name: "bootstrap Python"
        shell: bash
        run: |
          printf "%s\n" "::group::bootstrap-python-env"
          printf "python-path=%s\n" "${{ steps.build-python.outputs.python-path }}" >> "$GITHUB_OUTPUT"
          printf "PYTHON=%s\n" "${{ steps.build-python.outputs.python-path }}" >> "$GITHUB_ENV"
          printf "python-version=%s\n" "${{ steps.build-python.outputs.python-version }}" >> "$GITHUB_OUTPUT"
          printf "PYTHON_VERSION=%s\n" "${{ steps.build-python.outputs.python-version }}" >> "$GITHUB_ENV"
          printf "%s\n" "::endgroup::"
      - name: Setup build tools
        id: build_deps
        shell: bash
        run: pip install --no-input --user -r .github/gha-requirements.txt
      - name: Pre-Clean
        id: clean
        shell: bash
        run: make -j1 -f Makefile clean 2>/dev/null || true
      - name: Setup dependencies
        id: install_deps
        shell: bash
        run: pip install --no-input -r requirements.txt
      - name: Double-check dependencies
        id: check_deps
        shell: bash
        run: pip check --no-input || true # experimental for now
      - name: Build
        id: build
        shell: bash
        run: ${PYTHON} -m build
      - name: check build files
        id: buildfiles
        if: ${{ !cancelled() && (github.repository == 'raimon49/pip-licenses') && startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        run: |
          FILES=$(git ls-files -o --exclude-standard -i -- ${{ env.BUILD_MATCH_PATTERN }} )
          if [ -z "$FILES" ]; then
            printf "%s\n" "::warning file=.github/workflows/CD-PYPi.yml:: No Built files found."
            printf "%s\n" "files=" >> "$GITHUB_OUTPUT"
          else
            printf "%s\n" "Built files found:"
            printf "%s\n" "$FILES"
            # Replace line breaks with commas for GitHub Action Output
            FILES="${FILES//$'\n'/ }"
            printf "%s\n" "files=$FILES" >> "$GITHUB_OUTPUT"
          fi
      - name: Calculate artifact checksums
        run: |
          shasum -a 512 dist/* > build.checksums.txt
      - name: "Attest Build with Checksums"
        id: piplicenses-build-chksum-attest
        if: ${{ !cancelled() && (steps.buildfiles.outputs.files != '') && (github.repository == 'raimon49/pip-licenses') && startsWith(github.ref, 'refs/tags/') }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: build.checksums.txt
          github-token: ${{ github.token }}
      - name: Calculate pip hashes
        if: ${{ !cancelled() && (steps.buildfiles.outputs.files != '') && (github.repository == 'raimon49/pip-licenses') }}
        env:
          FILES: ${{ steps.buildfiles.outputs.files }}
        run: |
          for FILE in $FILES; do
              pip hash --no-input -a sha512 "$FILE" ;
              pip hash --no-input -a sha256 "$FILE" ;
          done ;
      - name: test pip hashes actually work
        shell: bash
        env:
          FILES: ${{ steps.buildfiles.outputs.files }}
        run: |
          shopts -s nullglob
          # Produce a temporary, hashed lockfile for runtime installs.
          first_path=$(printf "%s\n" $FILES | head -n1 );
          filename=${first_path##*/};
          version=${filename#pip_licenses-};
          version=${version%%-*};

          hashes=$(${PYTHON} -B -m pip hash -a sha512 "$FILE" | grep -F --color=never -- "--hash=sha");
          test -n "$hashes";
          
          printf "Consumer requirement:\n%s==%s" pip-licenses "$version"; printf " \\\\\n\t%s" $hashes; printf "\n" ;

          # Test each artifact in a separate fresh venv. This prevents one artifact's
          # install from affecting another test.
          file_index=1;
          for FILE in $FILES; do
            hash=$(${PYTHON} -B -m pip hash -a sha512 "$FILE" | grep -F --color=never -- "--hash=sha");
            test_venv="venv/test-$((++file_index))"

            "$PYTHON" -m venv "$test_venv"
            "$test_venv/bin/python" -m pip install -r ./requirements.txt

            printf '\n%s\n' "Testing $FILE" ;
            "$test_venv/bin/python" -m pip install \
              --no-deps \
              --require-hashes \
              --hash="$hash" \
              "$FILE"

            printf "%s\n" "PASS: $FILE" ;
            rm -frd "$test_env" 2>/dev/null || true ;
            unset test_env 2>/dev/null || true ;
            unset hash 2>/dev/null || true ;
          done ;
      - name: Upload release bundle
        id: upload
        if: ${{ !cancelled() && (steps.buildfiles.outputs.files != '') && (github.repository == 'raimon49/pip-licenses') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pip_licenses-official-build-${{ github.sha }}
          path: ${{ steps.buildfiles.outputs.files }}
          if-no-files-found: error
          retention-days: 3
          overwrite: true

  pypi-publish:
    name: Verify and publish to PyPI
    needs: pypi-build
    name: upload release to PyPI
    if: ${{ github.event_name == 'release' && (github.repository == 'raimon49/pip-licenses') && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    # Specifying a GitHub environment is optional, but strongly encouraged
    # environment: pypi
    permissions:
      # IMPORTANT: this permission is mandatory for Build Attestation
      attestations: write
      # IMPORTANT: this permission is mandatory for Uploading Attestation
      artifact-metadata: write
      # IMPORTANT: this permission is mandatory for Trusted Publishing
      id-token: write
      statuses: write
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    env:
      LANG: "en_US.UTF-8"

    steps:
      - name: Download build output
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.pypi-build.outputs.artifact-id }}
          pattern: pip_licenses-official-build-*
          path: release-bundle
          repository: raimon49/pip-licenses
          merge-multiple: true
          github-token: ${{ github.token }}
          digest-mismatch: error

      - name: Verify checksums and GitHub provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          # Change this to the exact path and capitalization of this workflow file.
          SIGNER_WORKFLOW: raimon49/pip-licenses/.github/workflows/CD-PYPi.yml
        run: |
          set -euo pipefail
          cd release-bundle
          # for log transparency
          shasum -a 512 dist/* | diff --unified build.checksums.txt -
          # and again for consistency
          shasum -a 512 -c build.checksums.txt

          shopt -s nullglob
          dists=(dist/*.whl dist/*.tar.gz dist/*.tar.bz2)
          ((${#dists[@]} > 0)) || {
            printf "%s\n" "::error::No distributions to verify." ;
            exit 1
          }

          for f in "${dists[@]}"; do
            gh attestation verify "$f" \
              --repo "$REPOSITORY" \
              --signer-workflow "$SIGNER_WORKFLOW" \
              --digest-alg sha512
          done

      - name: Publish package distributions to PyPI
        if: ${{ success() }}
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          skip-existing: true
          packages-dir: release-bundle/dist/
