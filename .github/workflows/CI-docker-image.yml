---
name: Build and Push Docker Image
run-name: Build ${{ github.ref_name }}
#
# "Continuous Integration workflow for building, the project."
#
# Jobs included:
# - build: building the image
#
# Required Secrets:
# NONE

on:  # yamllint disable-line rule:truthy
  push:
    branches: ["master", "next", "dev-**"]
    tags: ["v-*"]
  pull_request:
    branches: ["master", "next", "dev-**"]

# Declare default permissions as none.
permissions: {}

jobs:
  seed:
    permissions:
      actions: read
      contents: read
      packages: none
      pull-requests: read
    runs-on: macos-latest  # Has FreeBSD date (with -j and -f [format] options)
    outputs:
      timestamp: ${{ steps.output_time.outputs.bootstrap-timestamp }}
      git-timestamp: ${{ steps.output_time.outputs.git-timestamp }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: false
      - id: output_time
        name: Get Git commit timestamps
        shell: bash
        run: |
          printf "%s\n" "::group::bootstrap-MITL-env"
          printf "bootstrap-timestamp=%s\n" $(git log -1 --pretty=%ct) >> "$GITHUB_OUTPUT"
          printf "TIMESTAMP=%s\n" $(git log -1 --pretty=%ct) >> "$GITHUB_ENV"
          printf "git-timestamp=%s %s\n" $(date -j -f "%s" "$(git log -1 --pretty=%ct)" "+%C%y-%d-%m %H:%M:%S") >> "$GITHUB_OUTPUT"
          printf "%s %s\n" "Docker image will be synced at time of:" $(date -j -f "%s" "$(git log -1 --pretty=%ct)" "+%C%y-%d-%m %H:%M:%S")
          printf "%s\n" "::endgroup::"

  build:
    permissions:
      actions: read
      contents: read
      packages: write
      pull-requests: read
      security-events: none
    needs: seed
    strategy:
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-latest
          - architecture: arm64
            runner: ubuntu-26.04-arm
          - architecture: arm
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: false

      - name: Prepare
        id: prep_output
        run: |
          platform=linux/${{ matrix.architecture }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

        # QEMU setup only for armv7 emulation
      - name: Set up QEMU (for armv7)
        if: ${{ matrix.architecture == 'arm' }}
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          platforms: linux/${{ matrix.architecture }}
          cleanup: true

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          context: git
          images: ghcr.io/ramion49/pip-licenses
          tags: |
            type=pep440,pattern={{version}}
            type=pep440,pattern={{raw}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
          logout: true

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          labels: ${{ steps.meta.outputs.labels }}
          tags: ghcr.io/ramion49/pip-licenses
          platforms: linux/${{ matrix.architecture }}
          build-args: |
            PIPL_VERSION=${{ steps.meta.outputs.version }}
            TARGETARCH=${{ matrix.architecture }}
            PIPL_DATE_EPOCH=${{ needs.seed.outputs.git-timestamp }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max
          attests: |
            type=sbom
            type=provenance
          sbom: true
          provenance: mode=max
          push: true
          annotations: |
            index.org.opencontainers.image.title=pip-licenses
            index.org.opencontainers.image.authors=reactive-firewall@users.noreply.github.com
            index.org.opencontainers.image.description=Multi-arch pip-licenses image
            index.org.opencontainers.image.licenses="MIT AND ((GPL-2.0-or-later OR GPL-3.0) OR (BSD-1-Clause OR BSD-2-Clause OR BSD-3-Clause OR BSD-4-Clause) OR Artistic-2.0)"
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true,annotation-index.org.opencontainers.image.description=Multi-arch pip-licenses image ${{ matrix.architecture }}
        env:
          SOURCE_DATE_EPOCH: ${{ needs.seed.outputs.timestamp }}
          PIPL_DATE_EPOCH: ${{ needs.seed.outputs.git-timestamp }}
          PIPL_VERSION: ${{ steps.meta.outputs.version }}
          TARGETARCH: ${{ matrix.architecture }}
      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Logout from Docker Hub
        run: docker logout

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    permissions:
      actions: read
      contents: read
      packages: write
      pull-requests: read
      security-events: none
    runs-on: ubuntu-latest
    needs: build
    outputs:
      merge_version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: false

      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
          logout: true

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          context: git
          images: ghcr.io/ramion49/pip-licenses
          tags: |
            type=pep440,pattern={{version}}
            type=pep440,pattern={{raw}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha
        env:
          SOURCE_DATE_EPOCH: ${{ needs.seed.outputs.timestamp }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        env:
          SOURCE_DATE_EPOCH: ${{ needs.seed.outputs.timestamp }}
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/ramion49/pip-licenses@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ghcr.io/ramion49/pip-licenses:${{ steps.meta.outputs.version }}

      - name: Ensure image is pullable locally
        run: |
          # ensure the platform-specific image manifest is present locally for Syft/Grype
          docker pull ghcr.io/ramion49/pip-licenses:${{ steps.meta.outputs.version }}

      - name: Pull Syft and Grype images
        run: |
          # ensure the Syft and Grype images are available
          docker pull anchore/syft:v1.51.1
          docker pull anchore/grype:v0.118.0

      - name: Generate SBOM (Syft) for this architecture
        env:
          IMAGE: ghcr.io/ramion49/pip-licenses:${{ steps.meta.outputs.version }}
        run: |
          SYFT_IMG=anchore/syft:v1.51.1  # adjust version if desired
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            $SYFT_IMG ${IMAGE} -o spdx-json > sbom.json

      - name: Scan image with Grype (vulnerability) and export results
        env:
          IMAGE: ghcr.io/ramion49/pip-licenses:${{ steps.meta.outputs.version }}
        run: |
          GRYPE_IMG=anchore/grype:v0.118.0
          # run grype against the image and produce JSON output
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            $GRYPE_IMG ${IMAGE} -o json > grype.json || true
          # (grype exits non-zero on findings; keep the job green by allowing non-zero)

      - name: Upload per-arch SBOM and Grype report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-and-scan
          path: |
            sbom.json

      - name: Logout from Docker Hub
        run: docker logout

  test:
    permissions:
      actions: read
      contents: read
      statuses: write
      packages: read
      pull-requests: read
      security-events: none
    needs: merge
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: false
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
          logout: true
      - name: Pull local copy for test
        run: |
          docker pull ghcr.io/ramion49/pip-licenses:${{ needs.merge.outputs.merge_version }}
      - name: Run Docker test container
        id: run_container
        shell: bash
        run: |
          docker run -d --name test-container ghcr.io/ramion49/pip-licenses:${{ needs.merge.outputs.merge_version }} /bin/bash -c "while true; do sleep 30; done"
          printf "::group::%s\n" "Testing"
          docker exec test-container --version
          docker exec test-container || exit 1 # as shown in README
          docker exec test-container --summary || exit 1 # as shown in README
          # might want docker exec test-container /bin/bash -c "python --version"
          printf "::endgroup::\n"
      - name: Clean up
        run: |
          docker stop test-container || true ;
          docker rm -f test-container
      - name: Logout from Docker Hub
        run: docker logout
