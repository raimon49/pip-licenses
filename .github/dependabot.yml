# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
---
version: 2

multi-ecosystem-groups:
  # Infrastructure updates - weekly, tracked in milestone
  infrastructure:
    schedule:
      interval: "weekly"
      day: "friday"
    assignees:
      - "reactive-firewall"
    labels: ["chore", "github_actions"]
    milestone: 9
    target-branch: "next"
    commit-message:
      prefix: "[CI] "
      include: "scope"

  # docker stuff (experimental for now)
  # docker -- individual

  # actual dependency updates
  direct-dependencies:
    schedule:
      interval: "daily"
    assignees:
      - "reactive-firewall"
    labels: ["dependencies"]
    target-branch: "master"
    commit-message:
      prefix: "[UPDATE] "
      include: "scope"

  # other transitive dependency updates
  indirect-dependencies:
    schedule:
      interval: "weekly"
      day: "friday"
    assignees:
      - "reactive-firewall"
    target-branch: "next"
    labels: ["chore"]
    commit-message:
      prefix: "[SYNC] Lockfile - "
      include: "scope"



updates:
  - package-ecosystem: "pip"  # See documentation for possible values
    directory: "/"  # Default location of package manifests (e.g., pyproject.toml)
    # target-branch: "master"
    versioning-strategy: increase-if-necessary
    # rebase-strategy: "disabled"  # enabled by default
    allow:
      - dependency-name: "prettytable"
        dependency-type: "direct"
      - dependency-name: "tomli"
        dependency-type: "production"
      - dependency-name: "wcwidth"  # historical (via prettytable)
        dependency-type: "production"
      # allow build/packaging transitive packages
      # (will only ever approve if already in pyproject.toml)
      - dependency-name: "build"
        dependency-type: "indirect"
      - dependency-name: "setuptools"
        dependency-type: "indirect"
      - dependency-name: "setuptools_scm"
        dependency-type: "indirect"
      - dependency-name: "pip"
        dependency-type: "indirect"
    # GHI-435 lead to the removal of an overriding ignore all (so no ignore by default now)
    # from the allow list the only prefix letters allowed are: b p s t w
    # from the allow list we can further limit direct to: p t w
    # from the allow list we can also further limit indirect to: b s
    # thus we can ignore many things to still limit the possible noise:
    ignore:
      - dependency-name: "a*"
      # but allow build
      - dependency-name: "c*"
      - dependency-name: "d*"
      - dependency-name: "e*"
      - dependency-name: "f*"
      - dependency-name: "g*"
      - dependency-name: "h*"
      - dependency-name: "i*"
      - dependency-name: "j*"
      - dependency-name: "k*"
      - dependency-name: "l*"
      - dependency-name: "m*"
      - dependency-name: "n*"
      - dependency-name: "o*"
      # but allow pr*
      # but allow pi*
      - dependency-name: "q*"
      - dependency-name: "r*"
      # but allow setuptool*
      # but allow t*
      - dependency-name: "u*"
      - dependency-name: "v*"
      # but allow w*
      - dependency-name: "x*"
      - dependency-name: "y*"
      - dependency-name: "z*"
    groups:
      python-dependencies:
        patterns:
          - "prettytable"
          - "tomli"
        dependency-type: "production"
    exclude-paths:
      - "requirements.txt"  # LOCKFILE from pip-compile
      - "dev-requirements.txt"  # MUST NOT BE CONFUSED for direct dependencies
      - "gha-requirements.txt"
      - "test-requirements.txt"
      - "ci-requirements.txt"
      - "*-requirements.txt"  # might not match as well, but best-effort
      - ".github/*"
      - "docs/*"
      - "docker/*"
    patterns: ["prettytable", "tomli"]
    multi-ecosystem-group: "direct-dependencies"
  - package-ecosystem: "pip"  # for CI/CD (rather than for pip-licenses)
    directory: ".github/"  # different to allow dependabot to work
    patterns: ["build", "pip", "setuptools", "wheel"]
    multi-ecosystem-group: "infrastructure"
    # target-branch: "next"
    versioning-strategy: increase
    allow:
      - dependency-type: "direct"
    # GHI-435 lead to the removal of an overriding ignore all (so no ignore by default now)
    # from the pattern list the only prefix letters allowed are: b p s w
    # from the pattern list we can further limit direct to: p
    # from the pattern list we can also further limit indirect to: b s w
    # thus we can ignore many things to still limit the possible noise:
    ignore:
      - dependency-name: "a*"
      # but allow build
      - dependency-name: "c*"
      - dependency-name: "d*"
      - dependency-name: "e*"
      - dependency-name: "f*"
      - dependency-name: "g*"
      - dependency-name: "h*"
      - dependency-name: "i*"
      - dependency-name: "j*"
      - dependency-name: "k*"
      - dependency-name: "l*"
      - dependency-name: "m*"
      - dependency-name: "n*"
      - dependency-name: "o*"
      # but allow pip
      - dependency-name: "q*"
      - dependency-name: "r*"
      # but allow setuptool*
      - dependency-name: "u*"
      - dependency-name: "v*"
      # but allow wheel
      - dependency-name: "x*"
      - dependency-name: "y*"
      - dependency-name: "z*"
    exclude-paths:
      - "pyproject.toml"
      - "docs/*"
      - "docker/*"
  - package-ecosystem: "github-actions"  # also for CI
    directory: ".github/workflows/"  # Location of package manifests
    # target-branch: "next"
    patterns: ["actions/*", "codecov/codecov-action", "docker/*", "github/*"]
    multi-ecosystem-group: "infrastructure"
    # rebase-strategy: "disabled"  # enabled by default
  - package-ecosystem: "docker"  # for docker stuff
    directory: "/"  # Location of dockerfile
    target-branch: "next"
    patterns: ["*"]
    # multi-ecosystem-group: "docker"  # not multi-ecosystem in docker case
    # rebase-strategy: "disabled"  # enabled by default
    allow:
      - update-types:
        - "version-update:semver-major"
    schedule:
      interval: "weekly"
      day: "friday"
    assignees:
      - "reactive-firewall"
    labels: ["chore"]
    milestone: 9
    target-branch: "next"
    commit-message:
      prefix: "[DOCKER] "
      include: "scope"
