[build-system]
requires = ["setuptools>=82.0.1", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[project]
name = "pip-licenses"
description = "Dump the software license list of Python packages installed with pip."
dynamic = ["version", "readme"]
# select EoL python support:
# https://peps.python.org/pep-0596/ -- allow 3.9.6 (xcode 26) & 3.9.25 (final)
# https://peps.python.org/pep-0619/ -- allow 3.10.20 (Circa 03/2026)
# https://peps.python.org/pep-0664/ -- allow >=3.11.15 (Circa 03/2026)
requires-python = ">=3.9.6, !=3.9.7, !=3.9.8, !=3.9.9, !=3.9.10, !=3.9.11, !=3.9.12, !=3.9.13, !=3.9.14, !=3.9.15, !=3.9.16, !=3.9.17, !=3.9.18, !=3.9.19, !=3.9.20, !=3.9.21, !=3.9.22, !=3.9.23, !=3.9.24, !=3.10.0, !=3.10.1, !=3.10.2, !=3.10.3, !=3.10.4, !=3.10.5, !=3.10.6, !=3.10.7, !=3.10.8, !=3.10.9, !=3.10.10, !=3.10.11, !=3.10.12, !=3.10.13, !=3.10.14, !=3.10.15, !=3.10.16, !=3.10.17, !=3.10.18, !=3.10.19, !=3.11.0, !=3.11.1, !=3.11.2, !=3.11.3, !=3.11.4, !=3.11.5, !=3.11.6, !=3.11.7, !=3.11.8, !=3.11.9, !=3.11.10, !=3.11.11, !=3.11.12, !=3.11.13, !=3.11.14, !=3.13.0, !=3.14.0, <3.15.0"  # !=3.15.0rc1
license = "MIT"
license-files = ["LICENSE"]
authors = [
	{"name" = "raimon", "email" = "raimon49@users.noreply.github.com"}, # 2018-2025 (retired)
	{"name" = "Mr. Walls", "email" = "reactive-firewall@users.noreply.github.com"},
]
maintainers = [
	{"name" = "Mr. Walls", "email" = "reactive-firewall@users.noreply.github.com"},
]
keywords = ["pip", "pypi", "package", "license", "check", "audit"]
classifiers = [
	"Development Status :: 5 - Production/Stable",
	"Intended Audience :: Developers",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3 :: Only",
	"Programming Language :: Python :: 3.9",
	"Programming Language :: Python :: 3.10",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.13",
	"Programming Language :: Python :: 3.14",
	"Topic :: System :: Systems Administration",
	"Topic :: System :: System Shells",
	"Typing :: Typed"
]
dependencies = [
	"prettytable >= 3.12.0",  # 3.16.0 is the last to support 3.9
	"tomli >= 2;python_version<'3.11'"
]
scripts = { "pip-licenses" = "piplicenses.__main__:main" }

[project.optional-dependencies]
dev = [
	"docutils>=0.19", # frontend.get_default_settings()
	"wheel",
	"mypy==1.19.1", # v1.19.1 is needed for python 3.9 support
	"pip-tools",
	"pypandoc",
	"pytest-cov",
	"pytest-runner",
	"ruff",
	"tomli-w",
	"virtualenv>=21.1.0",
]

[tool.pip-tools.compile]
dry-run = false
extra = ["dev"]
no-strip-extras = true
upgrade = true
output-file = "dev-requirements.in"

[project.urls]
homepage = "https://github.com/raimon49/pip-licenses"
issues = "https://github.com/raimon49/pip-licenses/issues"
license = "https://raw.githubusercontent.com/raimon49/pip-licenses/HEAD/LICENSE"
releasenotes = "https://github.com/raimon49/pip-licenses/releases"
repository = "https://github.com/raimon49/pip-licenses.git"

#[project.readme]
#file = "README.md"
#content-type = "text/markdown; charset=UTF-8; variant=GFM"

[tool.setuptools]
py-modules = ["pip-licenses"]

[tool.setuptools.dynamic]
version = {attr = "piplicenses.__version__"}
readme = {file = ["README.md", "CHANGELOG.md"], content-type = "text/markdown; charset=UTF-8; variant=GFM"}

[tool.pytest.ini_options]
addopts = "-v --cov --cov-report term-missing"

[tool.ruff]
line-length = 79
# Same as Black.
indent-width = 4
# assume python 3.9 support
target-version = "py39"

[tool.ruff.lint]
extend-select = [
	"ANN",    # flake8-annotations
	"B",      # flake8-bugbear
	"C4",     # flake8-comprehensions
	"FA",     # flake8-future-annotations
	"ISC",    # flake8-implicit-str-concat
	"LOG",    # flake8-logging
	"G",      # flake8-logging-format
	"PIE",    # flake8-pie
	"PYI",    # flake8-pyi
	"SIM",    # flake8-simplify
	"FLY",    # flynt
	"I",      # isort
	"PERF",   # Perflint
	"PGH",    # pygrep-hooks
	"UP",     # pyupgrade
	"FURB",   # refurb
	"RUF",    # Ruff-specific rules
]
extend-ignore = [
	"C401",   # Unnecessary generator (rewrite as a set comprehension)
	"F841",   # Local variable is assigned to but never used
	"FA100",  # DEPRECATED in v6.0+  # See new typing PEPs (TODO: enumerate)
	"SIM300", # Yoda condition detected
	"RUF005", # Consider unpacking instead of concatenation
	"RUF012", # Unnecessary noise about Python language (In Python defaults are always mutable)  # See https://github.com/astral-sh/ruff/issues/5243
	"RUF021", # Parenthesize `a and b` expressions when chaining `and` and `or` together, to make the precedence clear
	"RUF013", # Ignore PEP484 until GHI-316 is resolved
]
isort.known-first-party = ["piplicenses"]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?)(_{2,2})?)$"  # See https://regex101.com/r/U0tpDT/2

[tool.ruff.lint.flake8-annotations]
suppress-dummy-args = true
allow-star-arg-any = true

[tool.ruff.format]
# Like Black
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
# misc.
docstring-code-line-length = 79

[tool.mypy]
exclude = ["venv"]   # and thus venv[subprocess].CalledProcessError
python_version = 3.9 # should be the earliest supported version

[tool.ty.rules]
unused-ignore-comment = "warn"
redundant-cast = "warn"

[tool.coverage.run]
include = ["piplicenses/*.py"]

